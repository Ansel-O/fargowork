name: FargoWork add-on delivery integrity

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-integrity:
    if: github.repository == 'Ansel-O/fargowork'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify published contents and links
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          PRODUCT_FILES = {
              '.gitignore',
              'LICENSE',
              'README.md',
              'SKILL.md',
              'package-lock.json',
              'package.json',
              'references/ATTACHMENTS.md',
              'references/CHECKS.md',
              'references/CONNECTORS.md',
              'references/DEBUG.md',
              'scripts/fargowork.cjs',
              'scripts/lib/auth.cjs',
              'scripts/lib/common.cjs',
              'scripts/lib/native-attachment.cjs',
              'scripts/lib/official-cli.cjs',
              'scripts/lib/policy.cjs',
              'scripts/lib/process.cjs',
              'scripts/lib/runtime.cjs',
              'scripts/lib/support.cjs',
              'scripts/lib/verification.cjs',
              'scripts/setup.cjs',
              'skills/annual-leave/SKILL.md',
              'skills/business-trip/SKILL.md',
              'skills/external-expense-request/SKILL.md',
              'skills/procurement-request/SKILL.md',
              'workflows/annual-leave.cjs',
              'workflows/business-trip.cjs',
              'workflows/external-expense-request.cjs',
              'workflows/leave-trip-common.cjs',
              'workflows/payment-core.cjs',
              'workflows/payment-sources.cjs',
              'workflows/procurement-request.cjs',
          }
          PUBLIC_METADATA = {
              'manifest.json', 'CHANGELOG.md', 'SECURITY.md',
              '.github/workflows/delivery-integrity.yml',
              '.gitattributes', 'EXPORT-MANIFEST.json',
          }
          root = Path.cwd().resolve()
          expected = PRODUCT_FILES | PUBLIC_METADATA
          export = json.loads(Path('EXPORT-MANIFEST.json').read_text(encoding='utf-8'))
          package = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          metadata = json.loads(Path('package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          assert metadata['name'] == package['name'] == 'fargowork-openyida-skills'
          assert export['name'] == 'fargowork'
          assert export['version'] == package['version'] == metadata['version'] == lock['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', metadata['version'])
          assert not any(metadata.get(k) for k in ('dependencies', 'devDependencies', 'optionalDependencies')), 'CLI must be installed separately'
          assert set(lock.get('packages', {})) <= {''}, 'No bundled dependency lock entries'
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          assert tracked == expected, 'Unexpected or missing public files'
          for manifest, required in [(package, PRODUCT_FILES), (export, expected - {'EXPORT-MANIFEST.json'})]:
              assert set(manifest) == {'name', 'version', 'files'}
              assert isinstance(manifest['files'], list) and len(manifest['files']) == len(required)
              assert {f['path'] for f in manifest['files']} == required, 'Manifest differs from static allowlist'
              names = set()
              for item in manifest['files']:
                  assert set(item) == {'path', 'bytes', 'sha256'}
                  p = root / item['path']
                  assert item['path'] not in names and p.is_file() and not p.is_symlink()
                  names.add(item['path'])
                  assert p.resolve().is_relative_to(root)
                  assert type(item['bytes']) is int and item['bytes'] >= 0
                  assert isinstance(item['sha256'], str) and re.fullmatch(r'[a-f0-9]{64}', item['sha256'])
                  body = p.read_bytes()
                  assert len(body) == item['bytes'] and hashlib.sha256(body).hexdigest() == item['sha256']
          assert {p.parent.name for p in Path('skills').glob('*/SKILL.md')} == {'annual-leave', 'business-trip', 'procurement-request', 'external-expense-request'}
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'https://github.com/Ansel-O/fargowork' in readme
          assert 'https://github.com/openyida/openyida' in readme
          assert 'npm install -g openyida@2026.10.16' in Path('SKILL.md').read_text(encoding='utf-8')
          assert '.zip' not in readme.lower()
          for name in tracked:
              if not name.endswith('.md'):
                  continue
              source = Path(name)
              for link in re.findall(r'\]\((?!https?://|mailto:|#)([^)#]+)(?:#[^)]+)?\)', source.read_text(encoding='utf-8')):
                  target = (source.parent / link).resolve()
                  assert target.is_relative_to(root) and target.is_file(), (name, link)
          print('Public add-on contents, versions, checksums and links verified.')
          PY
      - name: Check JavaScript syntax and fixed workflow entry
        shell: bash
        run: |
          find scripts workflows -name '*.cjs' -print0 | xargs -0 -n1 node --check
          node scripts/fargowork.cjs workflows
