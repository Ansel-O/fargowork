name: FargoWork add-on delivery integrity

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-integrity:
    if: github.repository == 'Ansel-O/fargowork'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify published contents and links
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          PRODUCT_FILES = {
              '.gitignore',
              'LICENSE',
              'README.en.md',
              'README.md',
              'SKILL.md',
              'assets/finance-detail-editor.html',
              'assets/finance-trip-detail-editor.html',
              'assets/finance-expense-detail-editor.html',
              'assets/finance-payment-detail-editor.html',
              'assets/finance-meal-detail-editor.html',
              'assets/finance-expense-details.md',
              'assets/finance-meal-details.md',
              'assets/finance-payment-details.md',
              'assets/finance-trip-details.md',
              'config/company.json',
              'config/sources.json',
              'config/workflow-index.json',
              'config/workflow-versions.json',
              'config/workflows/assets/hardware_request.json',
              'config/workflows/assets/procurement_application.json',
              'config/workflows/assets/software_request.json',
              'config/workflows/business/business_card.json',
              'config/workflows/business/business_trip_application.json',
              'config/workflows/business/contract.json',
              'config/workflows/business/listing.json',
              'config/workflows/business/seal.json',
              'config/workflows/finance/default_bank_change.json',
              'config/workflows/finance/expense_reimbursement.json',
              'config/workflows/finance/external_expense_application.json',
              'config/workflows/finance/meal_transport.json',
              'config/workflows/finance/medical_checkup_reimbursement.json',
              'config/workflows/finance/trip_expense_reimbursement.json',
              'config/workflows/hr/employee_certificate.json',
              'config/workflows/hr/employer_housing.json',
              'config/workflows/hr/hr_offboarding.json',
              'config/workflows/hr/onboarding.json',
              'config/workflows/hr/probation_confirmation.json',
              'config/workflows/hr/probation_plan.json',
              'config/workflows/hr/referral_reward.json',
              'config/workflows/hr/resignation.json',
              'config/workflows/hr/transfer.json',
              'config/workflows/leave/annual_leave_application.json',
              'config/workflows/leave/annual_leave_cancellation.json',
              'config/workflows/leave/other_leave.json',
              'config/workflows/leave/paid_sick_leave.json',
              'config/workflows/leave/paid_sick_leave_cancellation.json',
              'config/workflows/leave/personal_leave.json',
              'config/workflows/leave/unpaid_sick_leave.json',
              'package-lock.json',
              'package.json',
              'references/ADAPTING.md',
              'references/ATTACHMENTS.md',
              'references/CHECKS.md',
              'references/CONNECTORS.md',
              'references/DEBUG.md',
              'references/FINANCE-DETAIL-EDITOR.md',
              'references/FINANCE-DETAILS.md',
              'references/PERSONAL.md',
              'references/WORKFLOW-DIRECTORY.md',
              'scripts/fargowork.cjs',
              'scripts/finance-editor-server.cjs',
              'scripts/lib/attachment-verification-cache.cjs',
              'scripts/lib/auth.cjs',
              'scripts/lib/common.cjs',
              'scripts/lib/draft-snapshot.cjs',
              'scripts/lib/native-attachment.cjs',
              'scripts/lib/official-cli.cjs',
              'scripts/lib/personal.cjs',
              'scripts/lib/policy.cjs',
              'scripts/lib/process.cjs',
              'scripts/lib/runtime.cjs',
              'scripts/lib/support.cjs',
              'scripts/lib/update-notice.cjs',
              'scripts/lib/verification.cjs',
              'scripts/lib/workflow-directory.cjs',
              'scripts/setup.cjs',
              'shared/account-recommendation.cjs',
              'shared/decimal-arithmetic.cjs',
              'shared/department-details.cjs',
              'shared/department-hierarchy.cjs',
              'shared/detail-review.cjs',
              'shared/employee-roster.cjs',
              'shared/employee-selection.cjs',
              'shared/exchange-rates.cjs',
              'shared/finance-calculations.cjs',
              'shared/finance-catalog.cjs',
              'shared/finance-detail-editor.cjs',
              'shared/finance-details.cjs',
              'shared/finance-local-editor.cjs',
              'shared/finance-local-update.cjs',
              'shared/finance-markdown.cjs',
              'shared/initial-values.cjs',
              'shared/leave-calendar.cjs',
              'shared/local-datetime.cjs',
              'shared/payment-history.cjs',
              'shared/process-association.cjs',
              'shared/reimbursement-info.cjs',
              'shared/scoped-catalog.cjs',
              'shared/travel-allowance.cjs',
              'shared/workflow-attachments.cjs',
              'shared/workflow-subject.cjs',
              'skills/assets/hardware-request/SKILL.md',
              'skills/assets/procurement-application/SKILL.md',
              'skills/assets/software-request/SKILL.md',
              'skills/business/business-card/SKILL.md',
              'skills/business/business-trip-application/SKILL.md',
              'skills/business/contract/SKILL.md',
              'skills/business/listing/SKILL.md',
              'skills/business/seal/SKILL.md',
              'skills/finance/default-bank-change/SKILL.md',
              'skills/finance/expense-reimbursement/SKILL.md',
              'skills/finance/external-expense-application/SKILL.md',
              'skills/finance/meal-transport/SKILL.md',
              'skills/finance/medical-checkup-reimbursement/SKILL.md',
              'skills/finance/trip-expense-reimbursement/SKILL.md',
              'skills/hr/employee-certificate/SKILL.md',
              'skills/hr/employer-housing/SKILL.md',
              'skills/hr/hr-offboarding/SKILL.md',
              'skills/hr/onboarding/SKILL.md',
              'skills/hr/probation-confirmation/SKILL.md',
              'skills/hr/probation-plan/SKILL.md',
              'skills/hr/referral-reward/SKILL.md',
              'skills/hr/resignation/SKILL.md',
              'skills/hr/transfer/SKILL.md',
              'skills/leave/annual-leave-application/SKILL.md',
              'skills/leave/annual-leave-cancellation/SKILL.md',
              'skills/leave/other-leave/SKILL.md',
              'skills/leave/paid-sick-leave-cancellation/SKILL.md',
              'skills/leave/paid-sick-leave/SKILL.md',
              'skills/leave/personal-leave/SKILL.md',
              'skills/leave/unpaid-sick-leave/SKILL.md',
              'workflows/asset-common.cjs',
              'workflows/assets/hardware-request.cjs',
              'workflows/assets/procurement-application.cjs',
              'workflows/assets/software-request.cjs',
              'workflows/business-trip-common.cjs',
              'workflows/business/business-card.cjs',
              'workflows/business/business-trip-application.cjs',
              'workflows/business/contract.cjs',
              'workflows/business/listing.cjs',
              'workflows/business/seal.cjs',
              'workflows/finance/default-bank-change.cjs',
              'workflows/finance/expense-reimbursement.cjs',
              'workflows/finance/external-expense-application.cjs',
              'workflows/finance/meal-transport.cjs',
              'workflows/finance/medical-checkup-reimbursement.cjs',
              'workflows/finance/trip-expense-reimbursement.cjs',
              'workflows/hr-common.cjs',
              'workflows/hr/employee-certificate.cjs',
              'workflows/hr/employer-housing.cjs',
              'workflows/hr/hr-offboarding.cjs',
              'workflows/hr/onboarding.cjs',
              'workflows/hr/probation-confirmation.cjs',
              'workflows/hr/probation-plan.cjs',
              'workflows/hr/referral-reward.cjs',
              'workflows/hr/resignation.cjs',
              'workflows/hr/transfer.cjs',
              'workflows/leave-common.cjs',
              'workflows/leave-trip-common.cjs',
              'workflows/leave/annual-leave-application.cjs',
              'workflows/leave/annual-leave-cancellation.cjs',
              'workflows/leave/other-leave.cjs',
              'workflows/leave/paid-sick-leave-cancellation.cjs',
              'workflows/leave/paid-sick-leave.cjs',
              'workflows/leave/personal-leave.cjs',
              'workflows/leave/unpaid-sick-leave.cjs',
              'workflows/procurement-common.cjs',
          }
          PUBLIC_METADATA = {
              'manifest.json', 'CHANGELOG.md', 'SECURITY.md',
              '.github/workflows/delivery-integrity.yml',
              '.gitattributes', 'EXPORT-MANIFEST.json',
          }
          root = Path.cwd().resolve()
          expected = PRODUCT_FILES | PUBLIC_METADATA
          export = json.loads(Path('EXPORT-MANIFEST.json').read_text(encoding='utf-8'))
          package = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          metadata = json.loads(Path('package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          assert metadata['name'] == package['name'] == 'fargowork-openyida-skills'
          assert export['name'] == 'fargowork'
          assert export['version'] == package['version'] == metadata['version'] == lock['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', metadata['version'])
          assert not any(metadata.get(k) for k in ('dependencies', 'devDependencies', 'optionalDependencies')), 'CLI must be installed separately'
          assert set(lock.get('packages', {})) <= {''}, 'No bundled dependency lock entries'
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          assert tracked == expected, 'Unexpected or missing public files'
          for manifest, required in [(package, PRODUCT_FILES), (export, expected - {'EXPORT-MANIFEST.json'})]:
              assert set(manifest) == {'name', 'version', 'files'}
              assert isinstance(manifest['files'], list) and len(manifest['files']) == len(required)
              assert {f['path'] for f in manifest['files']} == required, 'Manifest differs from static allowlist'
              names = set()
              for item in manifest['files']:
                  assert set(item) == {'path', 'bytes', 'sha256'}
                  p = root / item['path']
                  assert item['path'] not in names and p.is_file() and not p.is_symlink()
                  names.add(item['path'])
                  assert p.resolve().is_relative_to(root)
                  assert type(item['bytes']) is int and item['bytes'] >= 0
                  assert isinstance(item['sha256'], str) and re.fullmatch(r'[a-f0-9]{64}', item['sha256'])
                  body = p.read_bytes()
                  assert len(body) == item['bytes'] and hashlib.sha256(body).hexdigest() == item['sha256']
          assert {p.as_posix() for p in Path('skills').glob('*/*/SKILL.md')} == {name for name in PRODUCT_FILES if name.startswith('skills/') and name.endswith('/SKILL.md')}
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'https://github.com/Ansel-O/fargowork' in readme
          assert 'https://github.com/openyida/openyida' in readme
          assert 'npm install -g openyida@2026.10.19' in Path('SKILL.md').read_text(encoding='utf-8')
          assert '.zip' not in readme.lower()
          for name in tracked:
              if not name.endswith('.md'):
                  continue
              source = Path(name)
              for link in re.findall(r'\]\((?!https?://|mailto:|#)([^)#]+)(?:#[^)]+)?\)', source.read_text(encoding='utf-8')):
                  target = (source.parent / link).resolve()
                  assert target.is_relative_to(root) and target.is_file(), (name, link)
          print('Public add-on contents, versions, checksums and links verified.')
          PY
      - name: Check JavaScript syntax and fixed workflow entry
        shell: bash
        run: |
          find scripts workflows shared -name '*.cjs' -print0 | xargs -0 -n1 node --check
          node scripts/fargowork.cjs workflows
