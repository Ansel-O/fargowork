name: FargoWork public client release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the leading v (for example 0.5.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-plugin:
    name: Package Agent Plugin source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Validate and package public boundary
        shell: bash
        run: >-
          python tools/release/build_public_release.py
          --version "${{ steps.version.outputs.value }}"
          --output-dir "dist/release/v${{ steps.version.outputs.value }}/plugin"
      - name: Attest plugin source artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "dist/release/v${{ steps.version.outputs.value }}/plugin/fargowork-agent-plugin-v${{ steps.version.outputs.value }}.zip"
      - name: Upload plugin staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fargowork-plugin-v${{ steps.version.outputs.value }}
          path: dist/release/v${{ steps.version.outputs.value }}/plugin
          if-no-files-found: error

  native-client-artifacts:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} client artifacts
    needs: package-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install standalone builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.13.0
      - name: Build real CLI and bridge artifacts
        shell: bash
        run: >-
          python tools/release/build_local_release.py
          --version "${{ needs.package-plugin.outputs.version }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --output-dir "dist/release/v${{ needs.package-plugin.outputs.version }}/${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Attest native artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "dist/release/v${{ needs.package-plugin.outputs.version }}/${{ matrix.platform }}-${{ matrix.arch }}/*.zip"
      - name: Upload native artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fargowork-native-${{ matrix.platform }}-${{ matrix.arch }}-v${{ needs.package-plugin.outputs.version }}
          path: dist/release/v${{ needs.package-plugin.outputs.version }}/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    needs: [package-plugin, native-client-artifacts]
    if: ${{ needs.package-plugin.result == 'success' && needs.native-client-artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin staging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fargowork-plugin-v${{ needs.package-plugin.outputs.version }}
          path: dist/release/plugin
      - name: Download native staging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fargowork-native-*-v${{ needs.package-plugin.outputs.version }}
          path: dist/release/native
          merge-multiple: false
      - name: Assemble release root and checksums
        env:
          VERSION: ${{ needs.package-plugin.outputs.version }}
        shell: bash
        run: |
          root="dist/release/v${VERSION}"
          mkdir -p "$root"
          find dist/release/plugin dist/release/native -type f -name '*.zip' -exec cp {} "$root/" \;
          (cd "$root" && sha256sum *.zip > SHA256SUMS)
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          root = Path("dist/release") / f"v{version}"
          artifacts = [{"name": p.name, "sha256": __import__("hashlib").sha256(p.read_bytes()).hexdigest(), "size": p.stat().st_size} for p in sorted(root.glob("*.zip"))]
          manifest = {
              "format": "fargowork-release-manifest/v2",
              "name": "fargowork",
              "version": version,
              "tag": f"v{version}",
              "stage": "M6-office-pilot-rc-draft",
              "platforms": ["windows-x64", "linux-x64"],
              "artifacts": artifacts,
              "checksums": "SHA256SUMS",
              "cli": {"status": "emitted", "entrypoint": "fargowork"},
              "bridge": {"status": "emitted", "entrypoint": "fargowork bridge", "transport": "stdio -> MCP 2026-07-28 Streamable HTTP"},
              "workbuddy": {"status": "official-codebuddy-user-registration-ui-trust-required"},
              "macos": {"status": "deferred", "reason": "native Security.framework Keychain support is not included in this release"},
              "release": {"remote": "draft-only", "signing": "not-configured", "attestation": "CI-only"},
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Create draft release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package-plugin.outputs.version }}
        shell: bash
        run: >-
          gh release create "v${VERSION}"
          dist/release/v${VERSION}/*.zip
          dist/release/v${VERSION}/SHA256SUMS
          dist/release/v${VERSION}/release-manifest.json
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag --draft --title "FargoWork v${VERSION}"
          --notes "FargoWork office-pilot client RC: one CLI/bridge executable, Agent Plugin, adapters, and checksum-verified installers. WorkBuddy UI trust/enable remains user action; no Server source, rules, credentials, or business data is bundled."
